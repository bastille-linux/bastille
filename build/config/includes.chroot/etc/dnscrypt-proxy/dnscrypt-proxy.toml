# Bastille OS — dnscrypt-proxy configuration
# Replaces systemd-resolved; all DNS goes through DoH/DoT with DNSSEC

bootstrap_resolvers = ['9.9.9.11:53', '149.112.112.11:53', '1.1.1.1:53', '8.8.8.8:53']
ignore_system_dns = true
netprobe_timeout = 0
netprobe_address = '9.9.9.9:53'
user_name = '_dnscrypt-proxy'
log_level = 2
log_file = '/var/log/dnscrypt-proxy.log'
# IPv6 is disabled system-wide (sysctl), so binding [::1] would make the daemon exit.
listen_addresses = ['127.0.0.1:53']

# Maximum simultaneous DNS queries
max_clients = 250

# Use DoH servers only (no plain DNS fallback)
# Only the two static DoH servers below are used. There is deliberately no
# downloaded resolver list: with no network at boot it is a fatal error, and
# dnscrypt-proxy would exit instead of waiting for Wi-Fi.
server_names = ['bastille-cloudflare', 'bastille-quad9']

# Require servers to support DNS-over-HTTPS or DNSCrypt
require_dnssec = true
require_nolog  = true
require_nofilter = false   # allow filtering servers (malware blocking)

# Block known-bad domains
block_ipv6 = false

[blocked_names]
  # Blocked domains list (populated by security profile)
  blocked_names_file = '/etc/dnscrypt-proxy/blocked-names.txt'

[static]
  [static.'bastille-cloudflare']
  stamp = 'sdns://AgMAAAAAAAAABzEuMS4xLjEAEmNsb3VkZmxhcmUtZG5zLmNvbQovZG5zLXF1ZXJ5'
  [static.'bastille-quad9']
  stamp = 'sdns://AgMAAAAAAAAABzkuOS45LjkADWRucy5xdWFkOS5uZXQKL2Rucy1xdWVyeQ'
