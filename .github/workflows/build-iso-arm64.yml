name: Build Bastille ISO (ARM64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          apt-get update -qq
          apt-get install -y -qq python3
          apt-get install -y --no-install-recommends \
            bash \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-efi-arm64-bin \
            mtools \
            dosfstools \
            git \
            ca-certificates \
            age

      - name: Strip x86-only packages for arm64
        run: |
          sed -i '/xserver-xorg-video-intel/d' build/config/package-lists/bastille-base.list.chroot
          sed -i '/intel-microcode/d'          build/config/package-lists/bastille-base.list.chroot
          sed -i '/msr-tools/d'                build/config/package-lists/bastille-base.list.chroot
          sed -i '/dmidecode/d'                build/config/package-lists/bastille-base.list.chroot
          sed -i '/flashrom/d'                 build/config/package-lists/bastille-base.list.chroot
          sed -i '/torbrowser-launcher/d'      build/config/package-lists/bastille-base.list.chroot

      - name: Validate build inputs
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          apt-get install -y -qq python3
          bash scripts/validate-build.sh --check-apt
          bash scripts/test-installer-preflight.sh
          bash scripts/test-update-rollback.sh
          bash scripts/test-backup-safety.sh
          bash scripts/test-backup-roundtrip.sh

      - name: Build ISO
        shell: bash
        run: |
          set -o pipefail
          bash build.sh --architectures arm64 2>&1 | tee /tmp/bastille-build.log

      - name: Diagnose failed build
        if: failure()
        run: |
          echo "=== init-related packages in the chroot ==="
          chroot build/chroot dpkg -l 2>/dev/null | grep -E "systemd|elogind|sysv|openrc|insserv|initscripts|^ii +init " | awk '{print $1, $2, $3}' || true
          echo "=== who depends on systemd-sysv here ==="
          chroot build/chroot apt-cache rdepends --installed systemd-sysv 2>/dev/null | head -20 || true
          echo "=== chroot package list seen by apt ==="
          cat build/chroot/root/packages.chroot 2>/dev/null | head -5 || true
          ls build/config/package-lists/ || true

      - name: Extract squashfs and compute checksums
        run: |
          ls -lh build/live-image-arm64.hybrid.iso

          mkdir -p /mnt/bastille-iso
          mount -o loop,ro build/live-image-arm64.hybrid.iso /mnt/bastille-iso
          cp /mnt/bastille-iso/live/filesystem.squashfs bastille-live-arm64.squashfs
          umount /mnt/bastille-iso

          sha256sum build/live-image-arm64.hybrid.iso > bastille-arm64.iso.sha256
          sha256sum bastille-live-arm64.squashfs       > bastille-arm64.squashfs.sha256

          # Combined SHA256SUMS (bastille-update reads this)
          cat bastille-arm64.iso.sha256 bastille-arm64.squashfs.sha256 > SHA256SUMS-arm64
          cat SHA256SUMS-arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bastille-arm64
          path: |
            build/live-image-arm64.hybrid.iso
            bastille-live-arm64.squashfs
            SHA256SUMS-arm64
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-arm64
          path: /tmp/bastille-build.log
          retention-days: 3

      - name: Read release version
        id: ver
        run: |
          echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "name=Bastille OS $(cat VERSION) \"$(cat CODENAME)\"" >> "$GITHUB_OUTPUT"

      - name: Upload squashfs to existing release
        # ARM64 uploads to the same release tag the amd64 workflow created.
        # If no release exists yet, this creates one (idempotent via softprops).
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          draft: false
          files: |
            build/live-image-arm64.hybrid.iso
            bastille-live-arm64.squashfs
            SHA256SUMS-arm64
