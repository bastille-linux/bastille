name: Build Bastille ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            bash \
            python3 \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            git \
            ca-certificates \
            age

      - name: Validate build inputs
        run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          bash scripts/validate-build.sh --check-apt
          bash scripts/test-installer-preflight.sh
          bash scripts/test-update-rollback.sh
          bash scripts/test-backup-safety.sh
          bash scripts/test-backup-roundtrip.sh

      - name: Validate dnscrypt-proxy config
        run: |
          apt-get install -y --no-install-recommends dnscrypt-proxy
          # dnscrypt-proxy drops to its own user before reading the file, so the
          # config must sit somewhere that user can read.
          install -m 644 build/config/includes.chroot/etc/dnscrypt-proxy/dnscrypt-proxy.toml /etc/dnscrypt-proxy/dnscrypt-proxy.toml
          install -m 644 build/config/includes.chroot/etc/dnscrypt-proxy/blocked-names.txt /etc/dnscrypt-proxy/blocked-names.txt
          out="$(dnscrypt-proxy -config /etc/dnscrypt-proxy/dnscrypt-proxy.toml -check 2>&1 || true)"
          echo "$out"
          # Only fail on a config the daemon rejects, not on sandbox quirks (no network, no /var/log).
          if echo "$out" | grep -qi "unsupported key\|toml:\|unable to load"; then
            echo "dnscrypt-proxy rejected the shipped config" >&2
            exit 1
          fi

      - name: Stamp release version
        run: |
          # The updater compares /etc/bastille/version with the newest release tag.
          # Version comes from the VERSION file (x.y.z, bumped by hand) and the
          # release codename from CODENAME.
          echo "v$(cat VERSION)" > build/config/includes.chroot/etc/bastille/version
          cat CODENAME > build/config/includes.chroot/etc/bastille/codename
          sed -i "s#^BASTILLE_GITHUB_REPO=.*#BASTILLE_GITHUB_REPO=\"${{ github.repository }}\"#" \
            build/config/includes.chroot/etc/bastille/update.conf
          cat build/config/includes.chroot/etc/bastille/version build/config/includes.chroot/etc/bastille/update.conf | head -8

      - name: Build ISO
        shell: bash
        run: |
          set -o pipefail
          bash build.sh --architectures amd64 2>&1 | tee /tmp/bastille-build.log

      - name: Diagnose failed build
        if: failure()
        run: |
          echo "=== init-related packages in the chroot ==="
          chroot build/chroot dpkg -l 2>/dev/null | grep -E "systemd|elogind|sysv|openrc|insserv|initscripts|^ii +init " | awk '{print $1, $2, $3}' || true
          echo "=== who depends on systemd-sysv here ==="
          chroot build/chroot apt-cache rdepends --installed systemd-sysv 2>/dev/null | head -20 || true
          echo "=== chroot package list seen by apt ==="
          cat build/chroot/root/packages.chroot 2>/dev/null | head -5 || true
          ls build/config/package-lists/ || true

      - name: Extract squashfs and compute checksums
        run: |
          ls -lh build/live-image-amd64.hybrid.iso

          # Mount the ISO and extract the squashfs for the updater
          mkdir -p /mnt/bastille-iso
          mount -o loop,ro build/live-image-amd64.hybrid.iso /mnt/bastille-iso
          cp /mnt/bastille-iso/live/filesystem.squashfs bastille-live-amd64.squashfs
          umount /mnt/bastille-iso

          # Generate SHA256SUMS covering both the ISO and the raw squashfs
          (cd build && sha256sum live-image-amd64.hybrid.iso) > bastille-amd64.iso.sha256
          sha256sum bastille-live-amd64.squashfs       > bastille-amd64.squashfs.sha256

          # Combined SHA256SUMS (bastille-update reads this)
          cat bastille-amd64.iso.sha256 bastille-amd64.squashfs.sha256 > SHA256SUMS-amd64
          cat SHA256SUMS-amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bastille-amd64
          path: |
            build/live-image-amd64.hybrid.iso
            bastille-live-amd64.squashfs
            SHA256SUMS-amd64
          retention-days: 7

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-amd64
          path: /tmp/bastille-build.log
          retention-days: 3

      - name: Read release version
        id: ver
        run: |
          echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "name=Bastille OS $(cat VERSION) \"$(cat CODENAME)\"" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          body: |
            Automated build from commit ${{ github.sha }}.

            ## Architectures
            | Arch | File |
            |------|------|
            | x86_64 | `bastille-live-amd64.squashfs` · `bastille-live-amd64.iso` |
            | ARM64  | `bastille-live-arm64.squashfs` · `bastille-live-arm64.iso`  |

            ## Verify
            ```
            sha256sum -c SHA256SUMS
            ```

            ## Update
            Boot into Bastille OS and run:
            ```
            bastille-update apply
            ```
          draft: false
          files: |
            build/live-image-amd64.hybrid.iso
            bastille-live-amd64.squashfs
            SHA256SUMS-amd64
